{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1><div class="sub">Minimum 8 characters with letters and digits.</div></div></div>
<div class="card" style="max-width:460px">
  <form method="post" class="stack" data-main-form data-enter-last="submit">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div><label>New password</label><input type="password" name="new" required autocomplete="new-password"></div>
    <div><label>Confirm new password</label><input type="password" name="confirm" required autocomplete="new-password"></div>
    <div class="form-actions"><button class="btn btn-primary" type="submit" data-key="F6">Change password</button></div>
  </form>
</div>
{% endblock %}
