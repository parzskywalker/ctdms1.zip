{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:40px auto;text-align:center;padding:36px">
  <div class="muted" style="font-size:44px;font-weight:800">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="form-actions" style="justify-content:center"><a class="btn" href="javascript:history.back()">Go back</a><a class="btn btn-primary" href="/">Home</a></div>
</div>
{% endblock %}
{% block public %}
<div class="login-wrap"><div class="login" style="text-align:center"><div class="muted" style="font-size:40px;font-weight:800">{{ code }}</div><h1>{{ title }}</h1><p class="muted">{{ message }}</p><a class="btn btn-primary" href="/login">Sign in</a></div></div>
{% endblock %}
